onboarding = false
# herdr configuration
# https://herdr.dev

[theme]
# Follow the ANSI palette set by the current Omarchy terminal theme.
name = "terminal"

[keys]
# Prefix key to enter prefix mode (default: "ctrl+b")
prefix = "ctrl+a"
focus_agent = "prefix+alt+1..9"

[[keys.command]]
key = "prefix+a"
type = "plugin_action"
command = "herdr-last.toggle-tab"
description = "Toggle to last tab"

[[keys.command]]
key = "prefix+."
type = "plugin_action"
command = "herdr-last.toggle-workspace"
description = "Toggle to last workspace"

[ui]
agent_panel_sort = "priority"
sidebar_start_collapsed = true
sidebar_collapsed_mode = "hidden"
status_indicators = "symbols"

[ui.sound]
enabled = true
done_path = "sounds/done.mp3"
request_path = "sounds/request.mp3"

# Yazi (and other TUIs) need this to draw image previews in a pane.
# Off by default; Ghostty supports the protocol natively.
[experimental]
kitty_graphics = true
